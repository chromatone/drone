esizer, which provides an incredible amount of harmonic material to work with. <br data-v-6e7baf80>Use this free progressive web app as an electronic <a href="https://en.wikipedia.org/wiki/Tanpura" target="_blank" data-v-6e7baf80>tanpura</a> or a <a href="https://en.wikipedia.org/wiki/Shruti_box" target="_blank" data-v-6e7baf80>shruti box</a>.</div>`,2),L(`button`,{class:`absolute right-4 top-4`,onClick:t[0]||=t=>e.$emit(`close`)},[...t[2]||=[L(`div`,{class:`i-la-times`},null,-1)]]),L(`button`,{class:`shadow-lg hover-bg-dark-100 p-4 border-2 bg-dark-200 text-light-200 rounded-xl sticky bottom-0 z-200 w-full`,onClick:t[1]||=t=>e.$emit(`start`)},`Start`)]),t[6]||=Ha(`<div class="flex flex-wrap gap-2" data-v-6e7baf80><div class="gap-2 flex flex-col gap-2 max-w-75ch z-100 bg-dark-400 p-4 rounded-xl shadow-xl sticky top-0" style="flex:1 1 300px;" data-v-6e7baf80><div class="text-xl font-bold py-2" data-v-6e7baf80>Install this web-app for offline use!</div><p data-v-6e7baf80>This app is a PWA - Progressive Web-Application that can be installed and performs just like a regular app on your mobile or desktop platform.</p><div class="flex flex-col gap-4" data-v-6e7baf80><div class="p-0" data-v-6e7baf80><i class="i-la-apple inline-block text-lg" data-v-6e7baf80></i><b data-v-6e7baf80>iOS</b>: Open this page in Safari, tap the <i class="i-ic-round-ios-share inline-block" data-v-6e7baf80></i> &quot;Share&quot; button, then select <i class="i-material-symbols-add-box-outline-rounded inline-block" data-v-6e7baf80></i> &quot;Add to Home Screen&quot; action down in the list.</div><div class="p-0" data-v-6e7baf80><i class="i-la-android inline-block text-lg" data-v-6e7baf80></i><b data-v-6e7baf80>Android</b>: Open this page in Chrome, tap the menu button <i class="i-la-ellipsis-v inline-block" data-v-6e7baf80></i> (three dots), then select &quot;Add to Home Screen&quot;.</div><div class="p-0" data-v-6e7baf80><i class="i-la-apple inline-block text-lg" data-v-6e7baf80></i> <b data-v-6e7 he tone as it evolves and breathes with harmonics. Try singing to it, tuning your instruments, or just feeling the vibrations.</li><li data-v-6e7baf80>To adjust the amount of high-frequency content, use the <b data-v-6e7baf80>LP</b> slider - it sets the frequency of the global low-pass filter. <b data-v-6e7baf80>Q</b> is the resonance of the filter.</li><li data-v-6e7baf80>Press the <img src="`+new URL(`logo.svg`,import.meta.url).href+`" alt="Chromatone logo" class="w-4 inline-block" data-v-6e7baf80> button or use the <b data-v-6e7baf80>spacebar</b> keyboard key to toggle mute for all voices together.</li></ol></div></div>`,1),L(`div`,ib,[t[5]||=Ha(`<div class="i-la-copyright" data-v-6e7baf80></div><a class="op-50 hover-op-100 transition no-underline flex items-center gap-1" href="https://github.com/davay42" target="_blank" data-v-6e7baf80>davay42</a><p data-v-6e7baf80>|</p><a class="op-50 hover-op-100 transition no-underline flex items-center gap-1" href="https://chromatone.center/" target="_blank" data-v-6e7baf80>Chromatone</a><div class="flex-1" data-v-6e7baf80></div><div class="p-0" data-v-6e7baf80> 2026 MIT</div>`,6),L(`a`,ab,[t[4]||=L(`div`,{class:`i-la-github`},null,-1),L(`span`,null,` v.`+Se(I(eb)),1)])])]))}},[[`__scopeId`,`data-v-6e7baf80`]]),sb=0;function cb(e){let t=zt({}),n={voice:null},r=Rt({play:!1,active:e===0,vol:Hy(Vy(`drone-${e}-vol`,.8),.01,1),pan:Hy(Vy(`drone-${e}-pan`,0),-1,1),filterFreq:Hy(Vy(`drone-${e}-filterFreq`,16e3),100,16e3),filterQ:Hy(Vy(`drone-${e}-filterQ`,0),0,20),afFreq:Hy(Vy(`drone-${e}-afFreq`,.1),.1,10),afDepth:Hy(Vy(`drone-${e}-afDepth`,0),0,1),chorusRate:Hy(Vy(`drone-${e}-chorusRate`,.1),.1,10),chorusDepth:Hy(Vy(`drone-${e}-chorusDepth`,0),0,1),freq:vo(()=>Jy.freq*2**(e/12)),note:vo(()=>R_(r.freq).toNote()),color:vo(()=>ol(R_(r.freq).toMidi()-9,2)),lfo:0});n.voice=r,sb+=2,cr(()=>Jy.stopped,e=>{e?r.play=!1:r.active&&(r.play=!0)}),cr(()=>r.play,e=>{e?(t.synth||(Yy.initiated||(Xy(),Yy.initiated=!0,Jy.started=!0),i(),a()),r.active
